name: Build All Executables

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: 'Release tag name (optional, e.g. 1.4.7 to publish release, or leave empty for artifacts)'
        required: false
        default: ''
  push:
    branches:
      - master

jobs:
  run-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || '' }}
